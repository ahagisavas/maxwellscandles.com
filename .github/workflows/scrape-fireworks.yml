name: Scrape Fireworks Events

on:
  schedule:
    # Run at 8am and 8pm Eastern Time
    - cron: '0 12 * * *'  # 8am ET (12 UTC in winter, 13 in summer)
    - cron: '0 0 * * *'   # 8pm ET (00 UTC next day in winter, 01 in summer)
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 praw

      - name: Run scraper
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/scrape_fireworks.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add fireworks/events.json
            git commit -m "🎆 Update fireworks events"
            git push
          fi
